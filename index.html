<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cassetta Maroc — Moroccan Tapes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@300;400;500&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:#0a0a0a;--bg2:#111;--bg3:#181818;--green:#03a74e;--green2:#05c95e;
      --green-dim:rgba(3,167,78,0.12);--green-border:rgba(3,167,78,0.35);
      --white:#f5f5f0;--gray:#888;--dim:#2a2a2a;
      --font-d:'Bebas Neue',Impact,sans-serif;
      --font-b:'Lora',Georgia,serif;
      --font-m:'IBM Plex Mono',monospace;
    }
    html{scroll-behavior:smooth;}
    body{background:var(--bg);color:var(--white);font-family:var(--font-b);font-size:17px;line-height:1.7;overflow-x:hidden;}
    nav{position:fixed;top:0;left:0;right:0;z-index:200;display:flex;align-items:center;justify-content:space-between;padding:0 2.5rem;height:64px;background:rgba(10,10,10,0.94);border-bottom:1px solid var(--dim);backdrop-filter:blur(10px);}
    .logo-img{height:34px;width:auto;}
    .nav-links{display:flex;gap:2rem;list-style:none;align-items:center;}
    .nav-links a{font-family:var(--font-m);font-size:0.63rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--gray);text-decoration:none;transition:color 0.2s;}
    .nav-links a:hover{color:var(--green2);}
    .nav-cta{color:var(--bg)!important;background:var(--green)!important;padding:0.45rem 1.1rem;transition:background 0.2s!important;}
    .nav-cta:hover{background:var(--green2)!important;}
    .hero{min-height:100vh;display:grid;grid-template-columns:1fr 1fr;align-items:center;padding-top:64px;border-bottom:1px solid var(--dim);overflow:hidden;}
    .hero-left{padding:5rem 3rem 5rem 4rem;display:flex;flex-direction:column;}
    .hero-tag{font-family:var(--font-m);font-size:0.6rem;letter-spacing:0.28em;text-transform:uppercase;color:var(--green);margin-bottom:1.5rem;display:flex;align-items:center;gap:0.75rem;}
    .hero-tag::before{content:'';display:block;width:28px;height:1px;background:var(--green);}
    .hero h1{font-family:var(--font-d);font-size:clamp(5rem,8.5vw,9rem);line-height:0.9;letter-spacing:0.01em;color:var(--white);}
    .hero h1 .g{color:var(--green);}
    .hero-sub{font-family:var(--font-b);font-style:italic;font-size:1.05rem;color:var(--gray);max-width:400px;margin:2rem 0;line-height:1.8;}
    .hero-btns{display:flex;gap:1rem;}
    .btn-p{font-family:var(--font-m);font-size:0.63rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--bg);background:var(--green);padding:0.85rem 2rem;text-decoration:none;transition:background 0.2s;}
    .btn-p:hover{background:var(--green2);}
    .btn-s{font-family:var(--font-m);font-size:0.63rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--white);border:1px solid var(--dim);padding:0.85rem 2rem;text-decoration:none;transition:border-color 0.2s,color 0.2s;}
    .btn-s:hover{border-color:var(--green);color:var(--green);}
    .hero-right{position:relative;height:100%;min-height:100vh;background:var(--bg2);border-left:1px solid var(--dim);display:flex;align-items:center;justify-content:center;overflow:hidden;}
    .hero-bg-txt{position:absolute;font-family:var(--font-d);font-size:20vw;color:rgba(3,167,78,0.04);white-space:nowrap;pointer-events:none;letter-spacing:0.05em;user-select:none;}
    .cassette-wrap{position:relative;animation:fl 4s ease-in-out infinite;z-index:2;}
    @keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
    .ticker{background:var(--green);overflow:hidden;padding:0.65rem 0;}
    .ticker-inner{display:flex;gap:3rem;width:max-content;animation:tick 25s linear infinite;}
    .ticker-item{font-family:var(--font-m);font-size:0.6rem;letter-spacing:0.22em;text-transform:uppercase;color:var(--bg);white-space:nowrap;display:flex;align-items:center;gap:0.75rem;font-weight:500;}
    .ticker-item::before{content:'▶';font-size:0.45rem;}
    @keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
    section{padding:5.5rem 4rem;}
    .container{max-width:1200px;margin:0 auto;}
    .lbl{font-family:var(--font-m);font-size:0.57rem;letter-spacing:0.3em;text-transform:uppercase;color:var(--green);display:flex;align-items:center;gap:0.6rem;margin-bottom:0.4rem;}
    .lbl::after{content:'';flex:1;max-width:36px;height:1px;background:var(--green);}
    .sec-title{font-family:var(--font-d);font-size:clamp(3rem,5vw,5.5rem);letter-spacing:0.02em;line-height:0.92;color:var(--white);margin-bottom:2.5rem;}
    .feat-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--dim);border:1px solid var(--dim);}
    .feat-main{background:var(--bg2);padding:3rem;display:flex;flex-direction:column;gap:1.5rem;}
    .tape-art{width:100%;height:200px;background:var(--bg3);border:1px solid var(--dim);display:flex;align-items:center;justify-content:center;}
    .itag{font-family:var(--font-m);font-size:0.53rem;letter-spacing:0.22em;text-transform:uppercase;color:var(--green);background:var(--green-dim);border:1px solid var(--green-border);padding:0.3rem 0.75rem;display:inline-block;width:fit-content;}
    .feat-main h3{font-family:var(--font-d);font-size:2.6rem;letter-spacing:0.02em;line-height:1;color:var(--white);cursor:pointer;}
    .feat-main h3:hover{color:var(--green);}
    .feat-main p{font-family:var(--font-b);font-style:italic;color:var(--gray);font-size:0.93rem;line-height:1.8;}
    .rlink{font-family:var(--font-m);font-size:0.6rem;letter-spacing:0.18em;text-transform:uppercase;color:var(--green);text-decoration:none;display:flex;align-items:center;gap:0.5rem;width:fit-content;border-bottom:1px solid var(--green-border);padding-bottom:2px;cursor:pointer;transition:color 0.2s;}
    .rlink:hover{color:var(--green2);}
    .feat-aside{background:var(--bg2);display:flex;flex-direction:column;}
    .sc{padding:2rem 2.5rem;border-bottom:1px solid var(--dim);flex:1;transition:background 0.2s;cursor:pointer;}
    .sc:last-child{border-bottom:none;}
    .sc:hover{background:var(--bg3);}
    .sc-n{font-family:var(--font-d);font-size:3rem;color:var(--dim);line-height:1;margin-bottom:0.4rem;}
    .sc h4{font-family:var(--font-d);font-size:1.45rem;letter-spacing:0.02em;color:var(--white);margin-bottom:0.4rem;}
    .sc p{font-family:var(--font-b);font-style:italic;font-size:0.85rem;color:var(--gray);}
    .cat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--dim);border:1px solid var(--dim);}
    .cat-box{background:var(--bg);padding:2.5rem 2rem;cursor:pointer;transition:background 0.2s;position:relative;overflow:hidden;}
    .cat-box::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:var(--green);transform:scaleX(0);transition:transform 0.3s;transform-origin:left;}
    .cat-box:hover{background:var(--bg2);}
    .cat-box:hover::after{transform:scaleX(1);}
    .cat-n{font-family:var(--font-m);font-size:0.53rem;letter-spacing:0.2em;color:var(--dim);margin-bottom:0.7rem;}
    .cat-name{font-family:var(--font-d);font-size:1.6rem;letter-spacing:0.02em;color:var(--white);margin-bottom:0.4rem;}
    .cat-desc{font-family:var(--font-b);font-style:italic;font-size:0.83rem;color:var(--gray);}
    .blog-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--dim);border:1px solid var(--dim);}
    .bc{background:var(--bg2);padding:2.5rem 2rem;display:flex;flex-direction:column;gap:0.75rem;transition:background 0.2s;cursor:pointer;}
    .bc:hover{background:var(--bg3);}
    .bc:hover .arr{color:var(--green);}
    .ccat{font-family:var(--font-m);font-size:0.53rem;letter-spacing:0.22em;text-transform:uppercase;color:var(--green);}
    .cn{font-family:var(--font-d);font-size:4rem;color:var(--dim);line-height:1;}
    .bc h4{font-family:var(--font-d);font-size:1.35rem;letter-spacing:0.02em;line-height:1.1;color:var(--white);}
    .bc p{font-family:var(--font-b);font-style:italic;font-size:0.87rem;color:var(--gray);line-height:1.75;flex:1;}
    .cfoot{display:flex;justify-content:space-between;align-items:center;padding-top:1rem;border-top:1px solid var(--dim);}
    .cdate{font-family:var(--font-m);font-size:0.53rem;letter-spacing:0.15em;color:var(--dim);}
    .arr{font-size:0.85rem;color:var(--dim);transition:color 0.2s;}
    .about-inner{display:grid;grid-template-columns:1fr 1.6fr;gap:5rem;align-items:center;}
    .alogo{background:var(--bg3);border:1px solid var(--dim);display:flex;align-items:center;justify-content:center;padding:4rem 3rem;position:relative;}
    .alogo::after{content:'';position:absolute;bottom:0;left:0;right:0;height:3px;background:var(--green);}
    .alogo img{width:100%;max-width:240px;}
    .stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--dim);border:1px solid var(--dim);border-top:none;}
    .stat{background:var(--bg2);padding:1.5rem 1rem;text-align:center;}
    .stat-n{font-family:var(--font-d);font-size:2.8rem;color:var(--green);letter-spacing:0.02em;line-height:1;}
    .stat-l{font-family:var(--font-m);font-size:0.53rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--gray);margin-top:0.25rem;}
    .at h3{font-family:var(--font-d);font-size:2.5rem;letter-spacing:0.02em;line-height:1;color:var(--white);margin-bottom:1.5rem;}
    .at h3 span{color:var(--green);}
    .at p{font-family:var(--font-b);font-style:italic;color:var(--gray);margin-bottom:1.2rem;line-height:1.85;}
    .sub-bg{background:var(--green);}
    .sub-inner{display:flex;align-items:center;justify-content:space-between;gap:3rem;padding:4rem;max-width:1200px;margin:0 auto;}
    .sub-txt h2{font-family:var(--font-d);font-size:3.5rem;letter-spacing:0.02em;line-height:1;color:var(--bg);}
    .sub-txt p{font-family:var(--font-b);font-style:italic;color:rgba(0,0,0,0.6);margin-top:0.4rem;}
    .sub-form{display:flex;min-width:400px;}
    .sub-form input{flex:1;background:rgba(0,0,0,0.15);border:1px solid rgba(0,0,0,0.25);border-right:none;outline:none;padding:1rem 1.25rem;font-family:var(--font-m);font-size:0.68rem;letter-spacing:0.1em;color:var(--bg);}
    .sub-form input::placeholder{color:rgba(0,0,0,0.4);}
    .sub-form button{background:var(--bg);border:1px solid var(--bg);padding:1rem 1.5rem;font-family:var(--font-m);font-size:0.6rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--green);cursor:pointer;transition:background 0.2s;white-space:nowrap;}
    .sub-form button:hover{background:#111;}
    footer{background:var(--bg);border-top:1px solid var(--dim);padding:1.75rem 4rem;display:flex;align-items:center;justify-content:space-between;}
    footer img{height:28px;}
    .fcopy{font-family:var(--font-m);font-size:0.53rem;letter-spacing:0.15em;color:var(--dim);}
    .flinks{display:flex;gap:1.5rem;}
    .flinks a{font-family:var(--font-m);font-size:0.55rem;letter-spacing:0.15em;text-transform:uppercase;color:var(--gray);text-decoration:none;transition:color 0.2s;}
    .flinks a:hover{color:var(--green);}
    .bg2s{background:var(--bg2);border-top:1px solid var(--dim);border-bottom:1px solid var(--dim);}
    .reader-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.92);display:none;align-items:flex-start;justify-content:center;z-index:500;overflow-y:auto;padding:3rem 2rem;}
    .reader-overlay.open{display:flex;}
    .reader-box{background:var(--bg2);border:1px solid var(--dim);width:720px;max-width:100%;padding:3.5rem;position:relative;margin:auto;}
    .reader-close{position:absolute;top:1.5rem;right:1.5rem;background:none;border:none;font-family:var(--font-m);font-size:0.6rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--gray);cursor:pointer;transition:color 0.2s;}
    .reader-close:hover{color:var(--green);}
    .reader-cat{font-family:var(--font-m);font-size:0.55rem;letter-spacing:0.25em;text-transform:uppercase;color:var(--green);margin-bottom:0.75rem;}
    .reader-title{font-family:var(--font-d);font-size:3.5rem;letter-spacing:0.02em;color:var(--white);line-height:1;margin-bottom:1rem;}
    .reader-meta{font-family:var(--font-m);font-size:0.55rem;letter-spacing:0.15em;color:var(--dim);margin-bottom:2rem;padding-bottom:1.5rem;border-bottom:1px solid var(--dim);}
    .reader-body{font-family:var(--font-b);font-size:1.05rem;color:var(--gray);line-height:1.9;white-space:pre-wrap;}
    .no-articles{grid-column:1/-1;padding:4rem;text-align:center;color:var(--dim);font-family:var(--font-m);font-size:0.6rem;letter-spacing:0.2em;}
  </style>
</head>
<body>

<nav>
  <img class="logo-img" src="logo.png" alt="Cassetta Maroc" />
  <ul class="nav-links">
    <li><a href="#articles">Articles</a></li>
    <li><a href="#categories">Explore</a></li>
    <li><a href="#about">About</a></li>
    <li><a href="#subscribe" class="nav-cta" id="nav-sub-btn">Subscribe</a></li>
  </ul>
</nav>

<header class="hero">
  <div class="hero-left">
    <p class="hero-tag" id="hero-tag"></p>
    <h1 id="hero-h1"></h1>
    <p class="hero-sub" id="hero-sub"></p>
    <div class="hero-btns">
      <a href="#articles" class="btn-p" id="hero-btn1"></a>
      <a href="#categories" class="btn-s" id="hero-btn2"></a>
    </div>
  </div>
  <div class="hero-right">
    <div class="hero-bg-txt">كاسيتا</div>
    <div class="cassette-wrap">
      <svg width="320" height="210" viewBox="0 0 320 210" fill="none">
        <rect x="3" y="3" width="314" height="204" rx="10" fill="#111" stroke="#2a2a2a" stroke-width="1.5"/>
        <rect x="82" y="18" width="156" height="96" rx="4" fill="#161616" stroke="#1e1e1e"/>
        <rect x="82" y="18" width="156" height="5" fill="#03a74e"/>
        <rect x="100" y="40" width="120" height="2.5" rx="1" fill="#03a74e" opacity="0.45"/>
        <text x="160" y="82" fill="#03a74e" font-size="10" text-anchor="middle" font-family="'Bebas Neue',sans-serif" letter-spacing="3">CASSETTA MAROC</text>
        <text x="160" y="99" fill="#444" font-size="6.5" text-anchor="middle" font-family="monospace" letter-spacing="2">SIDE A — 60 MIN</text>
        <circle cx="82" cy="152" r="42" fill="#0d0d0d" stroke="#1e1e1e"/><circle cx="82" cy="152" r="27" fill="#111" stroke="#252525"/><circle cx="82" cy="152" r="7.5" fill="#03a74e"/>
        <circle cx="238" cy="152" r="42" fill="#0d0d0d" stroke="#1e1e1e"/><circle cx="238" cy="152" r="27" fill="#111" stroke="#252525"/><circle cx="238" cy="152" r="7.5" fill="#03a74e"/>
        <path d="M124 152 Q160 134 196 152" stroke="#03a74e" stroke-width="2" fill="none"/>
        <rect x="145" y="188" width="30" height="10" rx="2" fill="#181818" stroke="#2a2a2a"/>
      </svg>
    </div>
  </div>
</header>

<div class="ticker"><div class="ticker-inner" id="ticker-inner"></div></div>

<section id="articles">
  <div class="container">
    <p class="lbl">Featured Story</p>
    <h2 class="sec-title">LATEST<br>ARTICLES</h2>
    <div id="featured-area"></div>
  </div>
</section>

<section id="categories" class="bg2s">
  <div class="container">
    <p class="lbl">Browse by Theme</p>
    <h2 class="sec-title">EXPLORE</h2>
    <div class="cat-row" id="cat-row"></div>
  </div>
</section>

<section>
  <div class="container">
    <p class="lbl">All Articles</p>
    <h2 class="sec-title">FROM THE<br>ARCHIVE</h2>
    <div class="blog-grid" id="all-articles-grid"></div>
  </div>
</section>

<section id="about" class="bg2s">
  <div class="container">
    <p class="lbl">About</p>
    <h2 class="sec-title">WHO<br>WE ARE</h2>
    <div class="about-inner">
      <div>
        <div class="alogo"><img src="logo.png" alt="Cassetta Maroc" /></div>
        <div class="stats-row" id="stats-row"></div>
      </div>
      <div class="at">
        <h3 id="about-title"></h3>
        <p id="about-p1"></p>
        <p id="about-p2"></p>
        <a href="admin.html" class="btn-p" style="margin-top:1rem;display:inline-block;">Admin Panel ⚙</a>
      </div>
    </div>
  </div>
</section>

<div class="sub-bg" id="subscribe">
  <div class="sub-inner">
    <div class="sub-txt"><h2 id="sub-headline"></h2><p id="sub-desc"></p></div>
    <div class="sub-form"><input type="email" placeholder="your@email.com" /><button id="sub-btn-el" type="button"></button></div>
  </div>
</div>

<footer>
  <img src="logo.png" alt="Cassetta Maroc" />
  <div class="fcopy" id="ft-copy"></div>
  <div class="flinks" id="ft-links"></div>
</footer>

<div class="reader-overlay" id="reader" onclick="if(event.target===this)closeReader()">
  <div class="reader-box">
    <button class="reader-close" onclick="closeReader()">✕ Close</button>
    <div class="reader-cat" id="r-cat"></div>
    <div class="reader-title" id="r-title"></div>
    <div class="reader-meta" id="r-meta"></div>
    <div class="reader-body" id="r-body"></div>
  </div>
</div>

<script>
  // ── DEFAULTS ──
  const D = {
    hero:{tag:'Moroccan Tapes · Est. Agadir',line1:'THE',line2:'SOUND',line3:'OF MAROC',sub:'A journal dedicated to the cassette tapes, artists, and stories that shaped Moroccan music culture.',btn1:'Explore Articles',btn2:'Browse Genres'},
    ticker:{tags:['Chaâbi','Gnawa','Jil Jilala','Rai Oranais','Amazigh','Andalous','Nass El Ghiwane','Desert Blues','Moroccan Jazz']},
    categories:[{name:'Artists & Legends',desc:'Portraits of the voices that shaped a generation'},{name:'Tape Reviews',desc:'Deep dives into iconic cassette releases'},{name:'Regional Sounds',desc:'From the Atlas Mountains to the Atlantic'},{name:'The Archive',desc:'Lost recordings, rediscovered stories'}],
    about:{title:'PRESERVING THE MAGNETIC MEMORY OF A CULTURE',p1:'Cassetta Maroc is an independent journal dedicated to the rich, underexplored history of cassette music in Morocco.',p2:'Each article is a love letter to the artists, the listeners, and the dusty tape players that kept the music alive.',s1n:'40+',s1l:'Articles',s2n:'12',s2l:'Genres',s3n:'80s',s3l:'Era Focus'},
    subscribe:{h1:'STAY ON',h2:'THE TAPE',desc:'New articles and rare finds, in your inbox.',btn:'Subscribe'},
    footer:{copy:'© 2025 Cassetta Maroc · All rights reserved',ig:'https://www.instagram.com/cassetta.maroc/',l2label:'Contact',l2url:'#'},
  };

  function get(key){ try{ return JSON.parse(localStorage.getItem('cm_'+key))||D[key]; }catch(e){ return D[key]; } }
  let articles=[];
  try{ articles=JSON.parse(localStorage.getItem('cassetta_articles')||'[]'); }catch(e){}

  // HERO
  const h=get('hero');
  document.getElementById('hero-tag').textContent=h.tag;
  document.getElementById('hero-h1').innerHTML=`${h.line1||''}<br><span class="g">${h.line2||''}</span><br>${h.line3||''}`;
  document.getElementById('hero-sub').textContent=h.sub;
  document.getElementById('hero-btn1').textContent=h.btn1;
  document.getElementById('hero-btn2').textContent=h.btn2;

  // TICKER
  const tk=get('ticker');
  const tags=[...(tk.tags||D.ticker.tags),...(tk.tags||D.ticker.tags)];
  document.getElementById('ticker-inner').innerHTML=tags.map(t=>`<div class="ticker-item">${t}</div>`).join('');

  // CATEGORIES
  const cats=get('categories');
  document.getElementById('cat-row').innerHTML=cats.map((c,i)=>`
    <div class="cat-box"><div class="cat-n">0${i+1}</div><div class="cat-name">${c.name}</div><div class="cat-desc">${c.desc}</div></div>
  `).join('');

  // ABOUT
  const ab=get('about');
  document.getElementById('about-title').innerHTML=ab.title.replace('MEMORY','<span>MEMORY</span>');
  document.getElementById('about-p1').textContent=ab.p1;
  document.getElementById('about-p2').textContent=ab.p2;
  document.getElementById('stats-row').innerHTML=[
    [ab.s1n,ab.s1l],[ab.s2n,ab.s2l],[ab.s3n,ab.s3l]
  ].map(([n,l])=>`<div class="stat"><div class="stat-n">${n}</div><div class="stat-l">${l}</div></div>`).join('');

  // SUBSCRIBE
  const sb=get('subscribe');
  document.getElementById('sub-headline').innerHTML=`${sb.h1}<br>${sb.h2}`;
  document.getElementById('sub-desc').textContent=sb.desc;
  document.getElementById('sub-btn-el').textContent=sb.btn;

  // FOOTER
  const ft=get('footer');
  document.getElementById('ft-copy').textContent=ft.copy;
  document.getElementById('ft-links').innerHTML=`
    <a href="${ft.ig}" target="_blank">Instagram</a>
    <a href="${ft.l2url}">${ft.l2label}</a>
    <a href="admin.html">Admin</a>
  `;

  // FEATURED ARTICLES
  function renderFeatured(){
    const area=document.getElementById('featured-area');
    if(!articles.length){
      area.innerHTML=`<div style="border:1px solid var(--dim);padding:4rem;text-align:center;color:var(--dim);font-family:var(--font-m);font-size:0.6rem;letter-spacing:0.2em;">No articles yet. <a href="admin.html" style="color:var(--green)">Go to Admin</a> to write your first one.</div>`;
      return;
    }
    const [first,...rest]=articles;
    const sides=rest.slice(0,3).map((a,i)=>`
      <div class="sc" onclick="openArticle('${a.id}')">
        <div class="sc-n">0${i+2}</div><h4>${a.title.toUpperCase()}</h4><p>${a.description||''}</p>
      </div>`).join('');
    area.innerHTML=`
      <div class="feat-grid">
        <div class="feat-main">
          <div class="tape-art"><svg width="250" height="155" viewBox="0 0 250 155" fill="none">
            <rect width="250" height="155" fill="#0d0d0d"/>
            <circle cx="66" cy="97" r="38" stroke="#03a74e" stroke-width="1.2"/><circle cx="66" cy="97" r="22" fill="#0a0a0a" stroke="#181818"/><circle cx="66" cy="97" r="5" fill="#03a74e"/>
            <circle cx="184" cy="97" r="38" stroke="#03a74e" stroke-width="1.2"/><circle cx="184" cy="97" r="22" fill="#0a0a0a" stroke="#181818"/><circle cx="184" cy="97" r="5" fill="#03a74e"/>
            <line x1="104" y1="97" x2="146" y2="97" stroke="#03a74e" stroke-width="1.5"/>
          </svg></div>
          <span class="itag">Featured · ${first.category}</span>
          <h3 onclick="openArticle('${first.id}')">${first.title.toUpperCase()}</h3>
          <p>${first.description||''}</p>
          <span class="rlink" onclick="openArticle('${first.id}')">Read Article →</span>
        </div>
        <div class="feat-aside">${sides||'<div class="sc"><div class="sc-n" style="color:var(--dim)">—</div><h4 style="color:var(--dim)">MORE COMING SOON</h4></div>'}</div>
      </div>`;
  }

  function renderGrid(){
    const grid=document.getElementById('all-articles-grid');
    if(!articles.length){
      grid.innerHTML=`<div class="no-articles">No articles yet — <a href="admin.html" style="color:var(--green)">write your first one</a></div>`;
      return;
    }
    grid.innerHTML=articles.map((a,i)=>`
      <div class="bc" onclick="openArticle('${a.id}')">
        <span class="ccat">${a.category}</span>
        <div class="cn">0${i+1}</div>
        <h4>${a.title.toUpperCase()}</h4>
        <p>${a.description||''}</p>
        <div class="cfoot"><span class="cdate">${a.date}</span><span class="arr">→</span></div>
      </div>`).join('');
  }

  function openArticle(id){
    const a=articles.find(x=>x.id===id);
    if(!a)return;
    document.getElementById('r-cat').textContent=a.category;
    document.getElementById('r-title').textContent=a.title.toUpperCase();
    document.getElementById('r-meta').textContent=a.date+' · Cassetta Maroc';
    document.getElementById('r-body').textContent=a.body||'(No content)';
    document.getElementById('reader').classList.add('open');
    document.body.style.overflow='hidden';
  }

  function closeReader(){
    document.getElementById('reader').classList.remove('open');
    document.body.style.overflow='';
  }

  document.addEventListener('keydown',e=>{ if(e.key==='Escape')closeReader(); });
  renderFeatured();
  renderGrid();
</script>
</body>
</html>
